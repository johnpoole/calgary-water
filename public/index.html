<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elbow River Monitor</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">WaterOffice station chain</p>
        <h1>Elbow River Monitor</h1>
      </div>
      <div class="controls">
        <label>
          History
          <select id="rangeSelect">
            <option value="2">2 days</option>
            <option value="7" selected>7 days</option>
            <option value="14">14 days</option>
            <option value="30">30 days</option>
            <option value="90">90 days</option>
          </select>
        </label>
        <label>
          Metric
          <select id="metricSelect">
            <option value="flow" selected>Flow</option>
            <option value="level">Level</option>
          </select>
        </label>
        <button id="refreshButton" type="button">Refresh</button>
      </div>
    </header>

    <main>
      <section class="status-strip" id="statusStrip">
        Loading WaterOffice readings...
      </section>

      <section class="station-grid" id="stationGrid" aria-live="polite"></section>

      <section class="flow-map-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Flow map</p>
            <h2>Downstream Flow Width</h2>
          </div>
          <p id="mapTimeLabel"></p>
        </div>
        <div class="map-slider-row">
          <label>
            Historical timestamp
            <input id="mapTimeSlider" type="range" min="0" max="0" value="0" step="1">
          </label>
          <button id="mapLatestButton" type="button">Latest</button>
        </div>
        <div id="flowMap"></div>
      </section>

      <section class="chart-layout">
        <div class="chart-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Historical values</p>
              <h2 id="chartTitle">Flow over time</h2>
            </div>
            <p id="sourceText"></p>
          </div>
          <div id="chart"></div>
        </div>
        <aside class="chain-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Downstream order</p>
              <h2>Stations</h2>
            </div>
          </div>
          <div id="stationChain"></div>
        </aside>
      </section>

      <section class="storage-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Storage locations</p>
            <h2>Reservoir Volume Change</h2>
          </div>
          <p id="storageSourceText"></p>
        </div>
        <div class="storage-grid" id="storageGrid"></div>
        <div id="storageChart"></div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
